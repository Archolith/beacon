name: Bug report
description: Report reproducible incorrect Beacon behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Beacon. Do not include secrets or private repository content.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe manifest, command, and steps that reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Beacon version
      placeholder: beacon 0.2.0rc1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe diagnostic output
      description: Paste redacted stderr or JSON diagnostics. Never paste tokens or private document content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private repository content.
          required: true
