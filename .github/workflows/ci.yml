name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      # pyproject declares an explicit `[tool.ruff.lint] select`, so a new ruff
      # release cannot silently widen what this gate enforces.
      - name: Ruff check
        run: python -m ruff check .

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # requires-python is >=3.12, so 3.12 is the floor.
        python-version: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # All runtime deps resolve from PyPI, archolith-mcp-framework included --
      # no git installs needed here, unlike the sibling repos.
      #
      # Test deps come from the PEP 735 [dependency-groups] dev group already in
      # pyproject, so the workflow does not restate package names. `--group`
      # needs pip >= 25.1 and the runner image can ship an older one, hence the
      # explicit upgrade.
      - name: Install beacon + dev group
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --group dev

      # The MCP server wires tools at import time; this catches registration
      # breakage that the unit suite does not reach.
      - name: Import smoke
        run: python -c "from beacon.mcp.server import mcp; print('beacon mcp ok')"

      - name: Run test suite
        run: python -m pytest -q
