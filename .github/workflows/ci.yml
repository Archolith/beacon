name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out Beacon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Temporary source-integration bridge. Release publishing deliberately
      # does not use this checkout and requires the framework from real PyPI.
      - name: Check out Archolith MCP Framework v0.3.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Archolith/archolith-mcp-framework
          ref: v0.3.0
          path: .deps/archolith-mcp-framework

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install .deps/archolith-mcp-framework
          python -m pip install -e ".[dev]"

      - name: Run offline test suite
        run: python -m pytest -p no:cacheprovider -q

      - name: Validate self-hosted manifest
        run: python -m beacon validate beacon.yaml

      - name: Inspect self-hosted manifest
        run: python -m beacon inspect beacon.yaml

      - name: Self-manifest deterministic export compare
        run: |
          python -c "import pathlib; pathlib.Path('.ci').mkdir(exist_ok=True)"
          python -m beacon export beacon.yaml --output .ci/self-a.json
          python -m beacon export beacon.yaml --output .ci/self-b.json
          python -c "import hashlib; a=open('.ci/self-a.json','rb').read(); b=open('.ci/self-b.json','rb').read(); raise SystemExit(0 if a==b and hashlib.sha256(a).hexdigest()==hashlib.sha256(b).hexdigest() else 1)"

      - name: Repository cleanliness check
        run: python scripts/check_repo_clean.py .

  quality:
    name: quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Beacon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Archolith MCP Framework v0.3.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Archolith/archolith-mcp-framework
          ref: v0.3.0
          path: .deps/archolith-mcp-framework

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install .deps/archolith-mcp-framework
          python -m pip install -e ".[dev,audit]"

      - name: Validate all Draft 2020-12 schemas and golden fixtures
        run: python -m pytest -p no:cacheprovider -q tests/test_snapshot.py tests/test_init_core.py tests/test_cli_result.py tests/test_release_check.py

      - name: Lint and type-check
        run: |
          validate-pyproject pyproject.toml
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy --no-incremental src

      - name: Run security audits
        run: |
          bandit -r src -q
          pip-audit --progress-spinner off --skip-editable

      - name: Run negative-control mutation gate
        run: python scripts/run_mutation_tests.py

      - name: Repository cleanliness check
        run: python scripts/check_repo_clean.py .

  package:
    name: package, wheel, and installed journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Beacon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Archolith MCP Framework v0.3.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Archolith/archolith-mcp-framework
          ref: v0.3.0
          path: .deps/archolith-mcp-framework

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip build twine check-wheel-contents
          python -m build --outdir .deps/framework-dist .deps/archolith-mcp-framework
          python -m pip install .deps/framework-dist/*.whl
          python -m pip install -e ".[dev]"
          python -m pytest -p no:cacheprovider -q
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Record distribution SHA256SUMS
        run: python scripts/write_sha256sums.py dist --out .ci/SHA256SUMS

      - name: Smoke installed wheels
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install .deps/framework-dist/*.whl
          .smoke/bin/python -m pip install dist/*.whl
          .smoke/bin/beacon --version
          .smoke/bin/beacon --help
          .smoke/bin/beacon validate beacon.yaml
          .smoke/bin/beacon inspect beacon.yaml

      - name: Example validate/inspect/export matrix and deterministic export compare
        run: |
          for example in library service monorepo-research; do
            .smoke/bin/beacon validate examples/$example/beacon.yaml
            .smoke/bin/beacon inspect examples/$example/beacon.yaml
            .smoke/bin/beacon export examples/$example/beacon.yaml --output /tmp/$example-a.json
            .smoke/bin/beacon export examples/$example/beacon.yaml --output /tmp/$example-b.json
            cmp /tmp/$example-a.json /tmp/$example-b.json
            .smoke/bin/beacon export --metadata-only examples/$example/beacon.yaml --output /tmp/$example-meta.json
          done

      - name: Installed-wheel full release journey
        run: |
          python scripts/release_check.py \
            --framework-wheel .deps/framework-dist/*.whl \
            --beacon-wheel dist/*.whl

      - name: Repository cleanliness check
        run: python scripts/check_repo_clean.py .

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archolith-beacon-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload distribution checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archolith-beacon-checksums
          path: .ci/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
