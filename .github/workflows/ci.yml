name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out Beacon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Temporary source-integration bridge. Release publishing deliberately
      # does not use this checkout and requires the framework from real PyPI.
      - name: Check out Archolith MCP Framework v0.2.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Archolith/archolith-mcp-framework
          ref: v0.2.0
          path: .deps/archolith-mcp-framework

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install .deps/archolith-mcp-framework
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -p no:cacheprovider -q

      - name: Validate self-hosted manifest
        run: python -m beacon validate beacon.yaml

  quality:
    name: quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Beacon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Archolith MCP Framework v0.2.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Archolith/archolith-mcp-framework
          ref: v0.2.0
          path: .deps/archolith-mcp-framework

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install .deps/archolith-mcp-framework
          python -m pip install -e ".[dev,audit]"

      - name: Lint and type-check
        run: |
          validate-pyproject pyproject.toml
          ruff check src tests
          ruff format --check src tests
          mypy --no-incremental src

      - name: Run security audits
        run: |
          bandit -r src -q
          pip-audit --progress-spinner off --skip-editable

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Beacon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Archolith MCP Framework v0.2.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Archolith/archolith-mcp-framework
          ref: v0.2.0
          path: .deps/archolith-mcp-framework

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip build twine check-wheel-contents
          python -m build --outdir .deps/framework-dist .deps/archolith-mcp-framework
          python -m pip install .deps/framework-dist/*.whl
          python -m pip install -e ".[dev]"
          python -m pytest -p no:cacheprovider -q
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Smoke installed wheels
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install .deps/framework-dist/*.whl
          .smoke/bin/python -m pip install dist/*.whl
          .smoke/bin/beacon --version
          .smoke/bin/beacon --help
          .smoke/bin/beacon validate beacon.yaml
          .smoke/bin/beacon inspect beacon.yaml

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archolith-beacon-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
