name: Publish release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    name: verify public-index build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "src")
          from beacon import __version__
          expected = f"v{__version__}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag/version mismatch: tag={actual!r}, expected={expected!r}")
          PY

      - name: Install only from public indexes
        run: |
          python -m pip install --upgrade pip build twine check-wheel-contents
          python -m pip install -e ".[dev]"

      - name: Test, build, and inspect distributions
        run: |
          python -m pytest -p no:cacheprovider -q
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Smoke installed public-index wheel
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install dist/*.whl
          .smoke/bin/beacon --version
          .smoke/bin/beacon validate beacon.yaml
          .smoke/bin/beacon inspect beacon.yaml

      - name: Installed-wheel full release journey
        # The release resolves the framework from the public index; the journey
        # runs with the installed wheel's interpreter (python -m beacon) so the
        # real stdio MCP enumeration/calls are exercised, and stays offline.
        run: |
          .smoke/bin/python scripts/release_check.py

      - name: Record distribution SHA256SUMS
        # Checksum lives outside dist/ so the publisher never sees it as a
        # distribution; it is attached to the GitHub release separately.
        run: python scripts/write_sha256sums.py dist --out .ci/SHA256SUMS

      - name: Repository cleanliness check
        run: python scripts/check_repo_clean.py .

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload distribution checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: .ci/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: trusted publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/archolith-beacon/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Download distribution checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: checksums

      - name: Create immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *"rc"* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* checksums/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
