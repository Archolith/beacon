beacon_version: "0.1"

project:
  name: beacon
  tagline: The missing handshake between software projects and coding agents.
  status: experimental
  description: >
    Beacon is a self-describing, machine-readable project knowledge surface.
    It exposes structured MCP tools so any coding agent can understand a
    project — its purpose, architecture, current work, canonical docs, risks,
    and conventions — without ad-hoc context stuffing.
    Beacon v0 is manifest-driven: a beacon.yaml plus an in-memory doc index
    powers every tool, with no external service dependency.
  repository: "https://github.com/Archolith/beacon"
  primary_language: Python
  license: MIT

purpose:
  one_sentence: >
    Beacon lets coding agents identify, orient, explain, and safely contribute
    to a project through structured, source-cited tools instead of guessing
    from a README.
  problem: >
    LLM agents onboard to projects through ad-hoc context stuffing: READMEs,
    docs, issues, commits, and maintainer memory pasted into a context window.
    This is slow, stale, and non-deterministic. Beacon changes the model: a
    project publishes its own living, structured understanding, and agents
    query it directly.
  non_goals:
    - Being a generic vector-memory store.
    - Being a documentation chatbot with freeform Q&A only.
    - Replacing git or source control.
    - Requiring Menhir or any external service for v0.
    - Claiming benchmark novelty without prior-art comparison.

audiences:
  - coding agents (Claude, Cursor, Codex, Gemini, OpenCode)
  - LLM coding tool developers
  - OSS maintainers who want agent-ready projects
  - developer-tool builders
  - AI memory researchers

current_focus:
  - manifest-driven MCP tools (v0, shipped)
  - functional product roadmap from local publishing through an operable v1
  - CLI validation and inspection commands
  - demo transcript and client setup docs
  - example manifests for different project shapes
  - golden-output tests for each tool

core_concepts:
  - id: beacon_manifest
    name: Beacon Manifest
    status: current
    description: >
      A beacon.yaml file checked into a project repo. Contains the project
      identity, purpose, core concepts, canonical docs, agent guidance, build
      commands, and guardrails. The manifest is the single source of truth for
      v0 — everything an agent receives derives from it deterministically.
    why_it_exists: >
      Projects need a machine-readable front door. A human-authored YAML
      manifest is inspectable, version-controlled, and requires no external
      service.

  - id: beacon_provider
    name: Beacon Provider
    status: current
    description: >
      A typed Protocol (BeaconProvider) that separates the MCP transport layer
      from the knowledge source. v0 ships ManifestBeaconProvider. A future
      MenhirBeaconProvider will plug in here using temporal memory, structure
      graphs, and git history, without touching the tools or the answer contract.
    why_it_exists: >
      The MCP tools should not care where knowledge comes from. The provider
      boundary lets a richer backend swap in without changing the agent-facing
      interface.
    related_concepts:
      - beacon_manifest

  - id: answer_contract
    name: Answer Contract
    status: current
    description: >
      Every Beacon tool response carries status (current/experimental/uncertain/mixed),
      confidence (low/medium/high), sources (file + line citations), and
      next_actions. This makes provenance and uncertainty first-class — agents
      should not treat all generated text equally.
    why_it_exists: >
      A system that returns text without provenance is a chatbot. Beacon's
      answer contract makes every claim traceable and every uncertainty explicit.
    related_concepts:
      - beacon_provider

  - id: doc_index
    name: Doc Index
    status: current
    description: >
      An in-memory index built at startup from the canonical_docs listed in the
      manifest. Markdown files are chunked at ATX headings. Keyword search
      scores chunks by bag-of-words overlap with a 1.5× boost for heading
      matches. Deterministic, no embeddings.
    why_it_exists: >
      v0 needs to surface doc content without an external search service.
      Heading-chunked keyword search is fast, honest, and easy to test.
    related_concepts:
      - beacon_manifest

  - id: guardrails
    name: Guardrails
    status: current
    description: >
      Named rules in the manifest that tell agents how not to break the project.
      Each guardrail has an id, rule text, scope, severity (low/medium/high),
      and a list of risky files. Exposed via the beacon_guardrails tool.
    why_it_exists: >
      Agents need structured, machine-readable rules — not just a prose warning
      in a README that may or may not be read.

canonical_docs:
  - path: README.md
    role: entrypoint
    status: current
    title: Public README — install, quick start, tool reference, client configs

  - path: .agent/README.md
    role: entrypoint
    status: current
    title: Agent entry point and maintenance rules

  - path: .agent/architecture.md
    role: architecture
    status: current
    title: System architecture — data flow, tech stack, package layout, provider interface

  - path: .agent/data_models.md
    role: reference
    status: current
    title: All schema types, answer-contract types, and serialization

  - path: docs/beacon-functional-product-roadmap.md
    role: product_roadmap
    status: current
    title: Canonical functional-product roadmap from v0 to v1

  - path: .agent/plans/beacon-v0.2-publishable-static-product-plan-2026-08-09.md
    role: implementation_plan
    status: current
    title: Beacon v0.2 publishable static product execution plan

  - path: .agent/plans/beacon-trust-hub-and-federation-plan-2026-08-09.md
    role: architecture_plan
    status: current
    title: Beacon Trust, Archolith Hub, and federation product plan

agent_guidance:
  read_first:
    - .agent/README.md
    - .agent/architecture.md
    - .agent/data_models.md
    - README.md

  safe_first_tasks:
    - Add or improve docs in .agent/ or docs/.
    - Add example manifests for a new project shape in docs/examples/.
    - Write a golden-output test for an existing MCP tool.
    - Extend docs/demo-transcript.md with a new query.
    - Fix a warning in beacon validate output.

  avoid_without_review:
    - Changing the BeaconProvider Protocol (breaks all provider implementations).
    - Changing the answer-contract dataclasses (breaks MCP tool output shape).
    - Changing the manifest schema (beacon_version stays "0.1" until a migration exists).
    - Adding new MCP tools before the existing five are well-documented.
    - Renaming core concepts (id, definition, status, confidence, sources).

  expected_behavior:
    - Prefer source-backed answers over guesses.
    - Mark uncertainty clearly — status and confidence fields exist for this.
    - Distinguish current decisions from experimental ideas or backlog items.
    - Update .agent/CHANGELOG.md when behavior changes.

build_and_test:
  setup: "pip install -e ."
  test: "python -m pytest tests/ -x --tb=short"
  benchmark: "# Oracle benchmarks: not yet implemented"

guardrails:
  - id: no_provider_protocol_change
    scope: provider_interface
    severity: high
    rule: >
      Do not change the BeaconProvider Protocol or the answer-contract
      dataclasses without updating ManifestBeaconProvider, all tests, and
      incrementing the schema version. The tool output shape is part of the
      public interface.
    applies_to:
      - src/beacon/provider/base.py
      - src/beacon/core/schema.py

  - id: no_manifest_schema_change
    scope: manifest_schema
    severity: high
    rule: >
      Do not add required manifest fields or change field names without a
      migration plan. Existing beacon.yaml files in the wild must still load.
      Use optional fields with defaults for additions.
    applies_to:
      - src/beacon/core/loader.py
      - src/beacon/core/schema.py
      - src/beacon/core/validator.py

  - id: no_new_tool_before_docs
    scope: mcp_surface
    severity: medium
    rule: >
      Do not add a sixth MCP tool until the existing five have a demo
      transcript, golden-output tests, and client setup docs. Interface
      clarity comes before surface area.
    applies_to:
      - src/beacon/mcp/tools/
      - src/beacon/mcp/server.py

  - id: test_before_commit
    scope: development_process
    severity: medium
    rule: >
      Run the full offline test suite before committing. All tests run
      without Neo4j, network, or external services.
    applies_to:
      - tests/
      - src/beacon/
