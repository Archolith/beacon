# nginx reverse proxy for Beacon — primary, complete example.
#
# beacon.example.org is a placeholder host name. Replace it and the TLS
# certificate paths with real values; no real hostnames, addresses, or keys
# belong in this file.
#
# Install as /etc/nginx/conf.d/beacon.conf (or another location included
# inside the http{} context — limit_req_zone and log_format are http-level
# directives), then validate with `nginx -t` and reload. This file ships
# unvalidated; see docs/deployment.md for the verification checklist.
#
# Shape: one HTTPS server on 443 routing /mcp to the MCP server
# (127.0.0.1:8766) and everything else to the JSON API (127.0.0.1:8765),
# plus an HTTP-to-HTTPS redirect server on 80. Both Beacon servers bind
# 127.0.0.1 only; TLS lives here and only here.

# Per-client-IP rate-limit zones. /v1/search runs a scan per query and /mcp
# carries tool traffic, so each gets its own, stricter zone; the rest of the
# JSON API shares the general zone. Rates are a starting point, not a tuning.
limit_req_zone $binary_remote_addr zone=beacon_api:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=beacon_search:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=beacon_mcp:10m    rate=5r/s;
limit_req_status 429;

# Access-log format that can never record a query string. /v1/search?q=...
# carries user queries, and queries are never logged. $uri is the path only.
# Never replace it with $request, $request_uri, $args, or $query_string —
# all four include the query string.
log_format beacon_no_query
    '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_user_agent"';

# Plain HTTP: redirect to HTTPS. 308 preserves the method, so deep links
# (including a /v1/search URL) survive the hop.
server {
    listen 80;
    server_name beacon.example.org;

    access_log /var/log/nginx/beacon.access.log beacon_no_query;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beacon.example.org;

    # TLS certificate placeholders — replace before use.
    ssl_certificate     /etc/letsencrypt/live/beacon.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beacon.example.org/privkey.pem;

    # GET/HEAD-only API plus small JSON-RPC envelopes: 64k is generous.
    # There is no legitimate large upload.
    client_max_body_size 64k;

    access_log /var/log/nginx/beacon.access.log beacon_no_query;

    # -----------------------------------------------------------------
    # MCP over Streamable HTTP -> 127.0.0.1:8766
    # -----------------------------------------------------------------
    location /mcp {
        # REQUIRED: the MCP server answers 421 to any request whose Host is
        # not 127.0.0.1/localhost (anti-DNS-rebinding guard). Without this
        # rewrite, every proxied MCP request is refused.
        proxy_set_header Host 127.0.0.1:8766;

        # Informational only; Beacon does not read these headers today.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Streamable HTTP: POST/GET on /mcp, long-lived Server-Sent Events,
        # and an Mcp-Session-Id request/response header. Ordinary headers are
        # forwarded, so the session id survives — the requirement is only to
        # never strip it. Unbuffered delivery and a long read timeout keep
        # idle event streams alive:
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        limit_req zone=beacon_mcp burst=20 nodelay;

        # Streamable HTTP methods: POST (messages), GET (SSE stream),
        # DELETE (session end).
        limit_except GET POST DELETE {
            deny all;
        }

        proxy_pass http://127.0.0.1:8766;
    }

    # -----------------------------------------------------------------
    # JSON API -> 127.0.0.1:8765 (includes /.well-known/archolith-beacon)
    # -----------------------------------------------------------------
    location / {
        # The JSON API has no Host check today; pin the upstream Host anyway
        # so the pattern is uniform with /mcp and future-proof.
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        limit_req zone=beacon_api burst=40 nodelay;

        # The JSON API serves GET and HEAD only.
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:8765;
    }

    # /v1/search executes a scan per query: strictest zone, exact match.
    location = /v1/search {
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        limit_req zone=beacon_search burst=5 nodelay;

        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:8765;
    }
}
