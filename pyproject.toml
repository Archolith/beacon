[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.1.0"
license = "MIT"
description = "Self-describing, machine-readable project knowledge surface for coding agents."
requires-python = ">=3.12"
dependencies = [
    "archolith-mcp-framework>=0.3.0",
    "fastmcp>=3.2.4,<4",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12,<1",
]

[project.scripts]
beacon = "beacon.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# Declared explicitly rather than inherited from whatever the installed ruff
# defaults to. Ruff 0.16 widened its default set, which is what turned
# archolith-bench's CI red for two months with no code change: under 0.16
# defaults this repo reports 24 findings, under the classic set it reports none.
# Pinning the rule set here makes the gate depend on this file, not on the
# linter version that happens to resolve. Widening it is a deliberate,
# separate change with its own cleanup.
select = ["E4", "E7", "E9", "F"]
