[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.1.0"
description = "Self-describing, machine-readable project knowledge surface for coding agents."
requires-python = ">=3.12"
dependencies = [
    "cth-mcp-framework>=0.1.0",
    "fastmcp>=3.2.4,<4",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12,<1",
]

[project.scripts]
beacon = "beacon.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
